name: trackflow

services:
  ui:
    build:
      context: .
      dockerfile: uis/Dockerfile
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/trackflow-api}
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-/trackflow-api/telemetry/events}
      NEXT_PUBLIC_APP_RELEASE: ${NEXT_PUBLIC_APP_RELEASE:-development}
      TRACKFLOW_API_INTERNAL_URL: http://backend:8000
      TALENT_API_INTERNAL_URL: ${TALENT_API_INTERNAL_URL:-https://playground.4geeks.com/tracker/api/v1}
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/workspace/uis
      - ./packages/business-logic:/workspace/packages/business-logic
    # Next.js caches include platform-native module paths. Keep container caches
    # ephemeral so a macOS `.next` directory cannot poison the Alpine runtime.
    tmpfs:
      - /workspace/uis/website/.next
      - /workspace/uis/backoffice/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trackflow

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////workspace/services/api/data/inventory.db}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3001}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-http://backend:8000/telemetry/events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/workspace/services/api
      - ./packages/incident_analyzer:/workspace/packages/incident_analyzer
      - ./packages/shared:/workspace/packages/shared
      - ./data/process:/workspace/data/process
      - ./data/pipelines:/workspace/data/pipelines
      - ./docs/company-knowledge-base:/workspace/docs/company-knowledge-base:ro
      - ./services/reporting:/workspace/services/reporting
      - api_data:/workspace/services/api/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - trackflow

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: celery -A celery_app:celery_app worker --loglevel=INFO --concurrency=1 --events
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////workspace/services/api/data/inventory.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./services/api:/workspace/services/api
      - ./packages/incident_analyzer:/workspace/packages/incident_analyzer
      - ./packages/shared:/workspace/packages/shared
      - ./data/process:/workspace/data/process
      - ./data/pipelines:/workspace/data/pipelines
      - ./services/reporting:/workspace/services/reporting
      - api_data:/workspace/services/api/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: celery -A celery_app:celery_app flower --port=5555
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - trackflow

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - trackflow

networks:
  trackflow:
    name: trackflow-development

volumes:
  api_data:
  redis_data:
  qdrant_data:
