[project]
name = "trackflow-agent"
version = "0.1.0"
description = "Explicit LangGraph orchestration for TrackFlow's grounded support agent"
requires-python = ">=3.11"
dependencies = [
    "langchain-mcp-adapters>=0.3,<1",
    "langgraph>=1.2,<2",
    "trackflow-pipeline>=0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trackflow_agent"]
package-dir = { trackflow_agent = "." }

[tool.uv.sources]
trackflow-pipeline = { path = "../../data/pipelines", editable = true }
