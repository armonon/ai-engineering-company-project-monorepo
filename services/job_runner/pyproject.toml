[project]
name = "trackflow-job-runner"
version = "0.1.0"
description = "Persistent lifecycle and locking for TrackFlow background jobs"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["job_runner"]
package-dir = { job_runner = "." }
