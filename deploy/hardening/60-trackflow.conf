# Install as /etc/ssh/sshd_config.d/60-trackflow.conf, validate with sshd -t,
# and keep the current session open until a second key-only session succeeds.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers trackflow
MaxAuthTries 3
X11Forwarding no
AllowTcpForwarding no
