[project]
name = "trackflow-process"
version = "0.1.0"
description = "Pure transformations for TrackFlow data pipelines"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trackflow_process"]
package-dir = { trackflow_process = "." }
